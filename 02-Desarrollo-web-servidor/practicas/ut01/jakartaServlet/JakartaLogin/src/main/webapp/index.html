<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Bienvenido</title>
<style>
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0E2438;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  .card {
    background: #fff;
    color: #0E2438;
    padding: 48px 40px;
    border-radius: 12px;
    text-align: center;
    max-width: 420px;
    box-shadow: 0 20px 50px rgba(0,0,0,.3);
  }
  h1 { margin-top: 0; font-size: 1.5rem; }
  p { color: #55606B; }
  a.boton {
    display: inline-block;
    margin-top: 24px;
    background: #E8432A;
    color: #fff;
    padding: 14px 32px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
  }
  a.boton:hover { background: #c93a22; }
</style>
</head>
<body>
  <div class="card">
    <h1>¿Quieres darte de alta en la aplicación?</h1>
    <p>Regístrate en unos segundos y cuéntanos qué tecnología te interesa más.</p>
    <a class="boton" href="alta">Darme de alta</a>
  </div>
</body>
</html>
