<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro Zion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Righteous&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 640 640"
          width="40"
          height="40"
          style="vertical-align: middle; fill: var(--amarillo)"
        >
          <path
            d="M529 71C519.6 61.6 504.4 61.6 495.1 71L447 119C444.6 121.4 442.7 124.3 441.5 127.5L426.1 168.5L348.6 246.1C303.5 216.7 249.3 215.9 217.6 247.7C206.6 258.7 199.6 272.3 196.2 287.3C192.5 303.9 177.1 318 160.1 318.9C134.5 320.2 110.8 329.6 92.8 347.5C48 392.3 56.4 473.3 111.5 528.4C166.6 583.5 247.6 592 292.4 547.2C310.3 529.3 319.8 505.5 321 479.9C321.9 462.9 336 447.6 352.6 443.8C367.6 440.4 381.2 433.3 392.2 422.4C424 390.6 423.2 336.5 393.8 291.4L471.4 213.8L512.4 198.4C515.6 197.2 518.5 195.3 520.9 192.9L568.9 144.9C578.3 135.5 578.3 120.3 568.9 111L529 71zM272 320C298.5 320 320 341.5 320 368C320 394.5 298.5 416 272 416C245.5 416 224 394.5 224 368C224 341.5 245.5 320 272 320z"
          />
        </svg>
        Pomodoro Zion 🌴
      </h1>
      <div id="user-bar">
        <span id="user-name"></span>
        <button id="logoutBtn" hidden>Cerrar sesión</button>
        <button id="deleteAccountBtn" hidden>Borrar cuenta</button>
        <form hidden id="change-password-form">
          <input type="password" id="currentPasswordInput" placeholder="Contraseña actual" minlength="6" required />
          <input type="password" id="changePasswordInput" placeholder="Nueva contraseña" minlength="6" required />
          <button type="submit">Cambiar contraseña</button>
        </form>
      </div>
    </header>

    <main hidden>
      <section id="pomodoro-section">
        <h2>Temporizador</h2>

        <div id="timer">25:00</div>

        <div id="phase"></div>
        <div id="cycle-dots"></div>
        <div class="timer-buttons">
        <button id="startTimerBtn">Iniciar</button>
        <button id="pauseTimerBtn">Pausar</button>
        <button id="resetTimerBtn">Reiniciar</button>
        </div>
      </section>

      <section id="task-section">
        <h2>Tareas</h2>

        <div id="task-form">
          <input type="text" id="titleInput" placeholder="Nueva tarea" />

          <input
            type="number"
            id="estimatedPomodorosInput"
            placeholder="Pomodoros estimados"
            min="1"
            value="1"
          />

          <button id="createBtn">Crear tarea</button>
        </div>
        <input type="text" id="taskSearch" placeholder="Buscar tarea..." />
        <ul id="taskList"></ul>
      </section>

      <section id="stats-section">
        <h2>Estadísticas de Hoy</h2>
        <div class="stats-grid">
          <div class="stat-card focus">
            <span class="stat-value" id="todayFocusCount">0</span>
            <span class="stat-label">Enfoques</span>
          </div>
          <div class="stat-card focus-time">
            <span class="stat-value" id="todayFocusTime">0m</span>
            <span class="stat-label">Tiempo enfoque</span>
          </div>
          <div class="stat-card break">
            <span class="stat-value" id="todayBreakCount">0</span>
            <span class="stat-label">Descansos</span>
          </div>
          <div class="stat-card break-time">
            <span class="stat-value" id="todayBreakTime">0m</span>
            <span class="stat-label">Tiempo descanso</span>
          </div>
        </div>
      </section>

      <section id="history-section">
        <h2>Historial Reciente</h2>
        <ul id="sessionList"></ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Pomodoro Zion</p>
    </footer>

    <div id="auth-overlay">
      <div class="auth-card">
        <h2>Bienvenido</h2>
        <div class="auth-tabs">
          <button type="button" id="tab-login" class="auth-tab active">Iniciar sesión</button>
          <button type="button" id="tab-register" class="auth-tab">Registrarse</button>
        </div>

        <form id="login-form">
          <input type="text" id="login-username" placeholder="Usuario" required />
          <input type="password" id="login-password" placeholder="Contraseña" required />
          <button type="submit">Entrar</button>
        </form>

        <form id="register-form" hidden>
          <input type="text" id="register-username" placeholder="Usuario (mín. 6)" minlength="6" required />
          <input type="password" id="register-password" placeholder="Contraseña (mín. 6)" minlength="6" required />
          <button type="submit">Crear cuenta</button>
        </form>
      </div>
    </div>

    <p id="toast" class="auth-error" hidden></p>
    <script src="script.js"></script>
  </body>
</html>
